<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge League</title>
  <!-- Link to CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
</head>
<body>
  <header>
    <h1 class="site-title">Challenge League</h1>
  </header>
  <main>
    <section class="timer-section" aria-label="Challenge Timer">
      <div class="timer-container" role="timer" aria-live="polite">
        <span id="timer-days" class="timer-value">0</span><span class="timer-label">d</span>
        <span id="timer-hours" class="timer-value">00</span><span class="timer-label">h</span>
        <span id="timer-minutes" class="timer-value">00</span><span class="timer-label">m</span>
        <span id="timer-seconds" class="timer-value">00</span><span class="timer-label">s</span>
      </div>
    </section>
    <section class="leaderboard-section" aria-label="Leaderboard">
      <ul id="leaderboard" class="leaderboard-list" role="list">
        <!-- Player entries rendered here -->
      </ul>
    </section>
    <section class="challenge-section" aria-label="Challenge Actions">
      <button id="challenge-btn" class="challenge-btn" aria-label="Challenge the Champion">Challenge</button>
    </section>
    <!-- Explosion animation canvas -->
    <canvas id="explosion-canvas" class="explosion-canvas" aria-hidden="true"></canvas>
  </main>
  <footer>
    <p>&copy; 2025 Challenge League</p>
  </footer>
  <!-- App JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
