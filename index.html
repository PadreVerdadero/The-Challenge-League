<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Challenge League</title>

  <!-- Cache-busted stylesheet link to force browsers to fetch the newest CSS after you push -->
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Challenge League</h1>
    </header>

    <section class="top-row">
      <aside class="left-col">
        <div id="champion-card" class="card"></div>
        <div id="challenge-section" class="card"></div>
      </aside>

      <section class="middle-col">
        <div id="roster" class="card"></div>

        <div class="card add-player">
          <input id="new-player-name" type="text" placeholder="New player name" />
          <button id="add-player-button">Add Player</button>
          <div id="add-player-log" class="log" aria-live="polite"></div>
        </div>

        <div id="match-list" class="card history"></div>
      </section>

      <aside class="right-col">
        <div id="champion-board-list" class="card"></div>
      </aside>
    </section>

    <canvas id="confetti-canvas" class="confetti" aria-hidden="true"></canvas>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
