<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Challenge League</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Optional: add a favicon to avoid 404 -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0b1220;
      color: #e6eef8;
      margin: 0;
      padding: 20px;
    }
    h2 {
      margin-top: 20px;
    }
    .roster-row, .next-up-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .roster-name.active { color: #1f6feb; }
    .roster-name.defeated { color: #888; text-decoration: line-through; }
    .order-handle { cursor: grab; }
    .move-btn { padding: 2px 6px; }
    .record-btn { padding: 4px 10px; }
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #challenge-modal {
      background: rgba(0,0,0,0.45);
    }
  </style>
</head>
<body>
  <h1>🏆 The Challenge League</h1>

  <!-- Champion -->
  <div id="champion-card"></div>

  <!-- Challenger -->
  <div id="challenge-section"></div>

  <!-- Roster -->
  <div id="roster"></div>

  <!-- Add Player -->
  <div style="margin-top:20px;">
    <input id="new-player-name" type="text" placeholder="Enter player name">
    <button id="add-player-button">Add Player</button>
  </div>

  <!-- Match History -->
  <div id="match-list"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Load app.js as ES module -->
  <script type="module" src="app.js"></script>
</body>
</html>
