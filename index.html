<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Challenge League</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon (optional). Remove this line if you don't have the file yet. -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>🏆 The Challenge League</h1>

  <!-- Champion -->
  <div id="champion-card" class="card"></div>

  <!-- Challenger -->
  <div id="challenge-section" class="card"></div>

  <!-- Roster -->
  <div id="roster" class="card"></div>

  <!-- Add Player -->
  <div class="card">
    <input id="new-player-name" type="text" placeholder="Enter player name">
    <button id="add-player-button">Add Player</button>
  </div>

  <!-- Match History -->
  <div id="match-list" class="card"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Load app.js as ES module -->
  <script type="module" src="app.js"></script>
</body>
</html>
